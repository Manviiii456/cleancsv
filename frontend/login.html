
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCSV - Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="container">

        <!-- Monkey Animation -->
        <div class="monkey" id="monkey">

            <div class="face">🐵</div>

            <div class="hand hand-left" aria-hidden="true">🖐️</div>
            <div class="hand hand-right" aria-hidden="true">🖐️</div>

            <p>Hello! Welcome Back!</p>

        </div>


        <!-- Login Form -->
        <div class="login">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to continue your journey
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="forgot-password.html">Forgot Password?</a>

                </div>

                <button type="submit">Login</button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="register.html">Sign Up</a>
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
