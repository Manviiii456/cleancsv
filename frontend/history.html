
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning History | CleanCSV</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav>
    <h2>CleanCSV</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="upload.html">Upload</a>
        <a href="analysis.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="#" id="logoutButton">Logout</a>
    </div>
</nav>


<section class="dashboard">

    <h1>CSV Upload History</h1>
    <p>View all your previously uploaded datasets.</p>

    <div class="issues">

        <h2>Uploaded Files</h2>

        <p id="historyMessage">Loading history...</p>

        <div style="overflow-x:auto;">

            <table>

                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Rows</th>
                        <th>Columns</th>
                        <th>Upload Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="historyTable"></tbody>

            </table>

        </div>

        <br>

        <a href="upload.html" class="btn">
            Upload New File
        </a>

    </div>

</section>


<script>

const API_URL = "http://127.0.0.1:8000";


async function loadHistory() {

    const message = document.getElementById("historyMessage");
    const table = document.getElementById("historyTable");

    const token = sessionStorage.getItem("cleancsv_token");

    // Check login token
    if (!token) {

        window.location.href = "login.html";
        return;

    }

    message.textContent = "Loading history...";

    try {

        // Send JWT authentication token
        const response = await fetch(`${API_URL}/history`, {

            method: "GET",

            headers: {
                "Authorization": `Bearer ${token}`
            }

        });

        if (response.status === 401 || response.status === 403) {

            sessionStorage.removeItem("cleancsv_token");
            sessionStorage.removeItem("cleancsv_logged_in");

            alert("Your session is invalid. Please login again.");

            window.location.href = "login.html";
            return;

        }

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                typeof data.detail === "string"
                    ? data.detail
                    : "Unable to retrieve history"
            );

        }

        table.innerHTML = "";

        if (!data.history || data.history.length === 0) {

            message.textContent = "No uploaded files found.";
            return;

        }

        message.textContent =
            `Total uploaded files: ${data.history.length}`;

        data.history.forEach(file => {

            const row = document.createElement("tr");

            const values = [
                file.filename || "Unknown",
                file.rows ?? "-",
                file.columns ?? "-",
                file.uploaded_at
                    ? new Date(file.uploaded_at).toLocaleString()
                    : "-",
                file.cleaned_path ? "Cleaned" : "Uploaded"
            ];

            values.forEach(value => {

                const cell = document.createElement("td");

                cell.textContent = value;

                row.appendChild(cell);

            });

            table.appendChild(row);

        });

    } catch (error) {

        message.textContent =
            "Error loading history: " + error.message;

        console.error("History Error:", error);

    }

}


loadHistory();

</script>

<script src="js/auth.js"></script>

</body>
</html>
