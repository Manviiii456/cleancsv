
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCSV - Forgot Password</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="container">

        <div class="monkey">
            <div class="face">🐵</div>
            <p>Let's reset your password!</p>
        </div>

        <div class="login">

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Enter your registered email and new password.
            </p>

            <form id="resetPasswordForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Reset Password
                </button>

            </form>

            <p id="resetMessage"></p>

            <p class="signup">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>

        </div>

    </div>

    <script src="js/forgot-password.js"></script>

</body>
</html>
