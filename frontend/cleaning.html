
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning | CleanCSV</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav>
    <h2>CleanCSV</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="upload.html">Upload</a>
        <a href="analysis.html">Dashboard</a>
        <a href="history.html">History</a>
    </div>
</nav>

<section class="upload-section">

    <h1>Clean Your Data</h1>
    <p>Select the cleaning operations you want to perform.</p>

    <!-- Cleaning Options -->
    <div class="upload-box">

        <h2>Cleaning Options</h2>

        <div class="cleaning-options">

            <label class="clean-option">
                <input type="checkbox" id="duplicates">
                <span>Remove Duplicate Rows</span>
            </label>

            <label class="clean-option">
                <input type="checkbox" id="missing">
                <span>Handle Missing Values</span>
            </label>

            <label class="clean-option">
                <input type="checkbox" id="spaces">
                <span>Remove Extra Spaces</span>
            </label>

            <label class="clean-option">
                <input type="checkbox" id="format">
                <span>Standardize Text Formatting</span>
            </label>

            <label class="clean-option">
                <input type="checkbox" id="types">
                <span>Convert Data Types</span>
            </label>

        </div>

        <button class="btn" onclick="previewCleaning()">
            Preview Cleaning Options
        </button>

        <p id="cleanMessage"></p>

    </div>

    <!-- Before and After Preview -->
    <div class="upload-box">

        <h2>Before & After Preview</h2>

        <p id="previewMessage">
            Select cleaning operations to see your preview.
        </p>

    </div>

    <!-- Clean and Download -->
    <div class="upload-box">

        <h2>Clean Your CSV File</h2>

        <button class="btn" id="cleanButton" onclick="cleanCSV()">
            Clean My Data
        </button>

        <p id="cleanStatus"></p>

        <button class="btn" id="downloadButton"
                onclick="downloadCSV()" disabled>
            Download Cleaned CSV
        </button>

    </div>

</section>

<script src="js/script.js"></script>

</body>
</html>
