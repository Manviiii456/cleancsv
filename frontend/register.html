
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCSV - Sign Up</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="container">

        <div class="monkey">
            <div class="face">🐵</div>
            <p>Welcome to CleanCSV!</p>
        </div>

        <div class="login">

            <h1>Create Account</h1>

            <p class="subtitle">Join CleanCSV today</p>

            <form id="registerForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Create password (minimum 8 characters)"
                    minlength="8"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    minlength="8"
                    required
                >

                <button type="submit">Sign Up</button>

            </form>

            <p id="registerMessage"></p>

            <p class="signup">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
