services:
  mongodb:
    image: mongo:7
    container_name: cleancsv-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: .
    container_name: cleancsv-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/
    depends_on:
      - mongodb
    volumes:
      - ./storage:/app/storage

volumes:
  mongodb_data: